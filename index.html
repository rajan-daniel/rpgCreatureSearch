<html lang="en">
<!--header-->

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="styles.css" />
</head>
<!--body-->
<div id="header">
    <img src="assets/banner.png" alt="img-not-found!">
    <h1 id="title">RPG Creature Lookup</h1>
    <p id="instructions">All the info you need, in one place! Search a creature by name to get started! 
  <strong>Powered by © RPG Creature API</strong></p>
</div>
<!--Search-->
<div id="search-container">
    <input id="search-input" required></input>
    <button id="search-button">Search</button>
</div>
<p>Name: <span id="creature-name"></span></p>
<p>ID: <span id="creature-id"></span></p>
<p>Weight: <span id="weight"></span></p>
<p>Height: <span id="height"></span></p>
<p>Types: <span id="types"></span></p>
<!--Stats-->
<p>HP: <span id="hp"></span></p>
<p>Attack: <span id="attack"></span></p>
<p>Defense: <span id="defense"></span></p>
<p>Special Attack: <span id="special-attack"></span></p>
<p>Special Defense: <span id="special-defense"></span></p>
<p>Speed: <span id="speed"></span></p>

<body>
    <script src="script.js"></script>
</body>

</html>
